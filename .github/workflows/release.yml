name: Release

# Lancement manuel (onglet Actions) tant que Folio n'est pas publié sur npm.
# S'il reste des changesets, ouvre (ou met à jour) la PR « chore: version des paquets ».
# Relancé après la fusion de cette PR, publie la nouvelle version sur npm, avec provenance.
# Prérequis pour publier : le secret NPM_TOKEN. Pour automatiser plus tard, remettre :
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Vérifier le paquet avant publication
        run: pnpm --filter @emmanuelplougoulm/folio build && pnpm lint:package

      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore: version des paquets'
          commit: 'chore: version des paquets'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
