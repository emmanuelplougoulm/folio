name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Installer Chromium pour les tests de stories
        run: pnpm --filter @emmanuelplougoulm/folio exec playwright install --with-deps chromium

      - name: Formatage, lint, typecheck, tests, build
        run: pnpm check

      - name: Build Storybook
        run: pnpm --filter @emmanuelplougoulm/folio build-storybook

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7
